name: Pull request title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  conventional-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      - name: Validate title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$PR_TITLE" =~ ^(feat|fix|test|docs|chore|refactor|perf|build|ci)(\([a-z0-9_-]+\))?(!)?:\ .+ ]]; then
            echo "PR title must follow Conventional Commits, for example: feat(profile): add student search"
            exit 1
          fi
